<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Plant Doctor | PlantPulse</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f7f0;
            color: #174d32;
        }

        nav {
            background: white;
            padding: 22px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            font-size: 30px;
            color: #176b45;
        }

        nav a {
            text-decoration: none;
            color: #174d32;
            font-weight: bold;
        }

        .doctor-container {
            max-width: 850px;
            margin: 55px auto;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        .doctor-container h1 {
            text-align: center;
            font-size: 35px;
            margin-bottom: 15px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 35px;
        }

        label { 
            display: block;
            font-weight: bold;
            margin: 20px 0 10px;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 15px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            display: block;
            margin: 30px auto 0;
            padding: 14px 35px;
            background: #16834e;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #105c37;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            background: #e9f6ed;
            border-radius: 12px;
            display: none;
        }
    </style>
</head>
<body>
    <nav>
        <h2>PlantPulse</h2>
        <a href="index.html">Home</a>
    </nav>

    <div class="doctor-container">

        <h1>AI Plant Doctor</h1>

        <p class="subtitle">
            Tell us about your plant's problems.
            We'll help you understand its needs.
        </p>

        <form id="doctorForm">

            <label>Plant Name</label>

            <input 
                type="text"
                id="plantName"
                placeholder="Example: Rose, Money Plant"
                required
            >

            <label> What problem are you noticing?</label>

            <select id="problem">

                <option value="">Select a problem</option>

                <option>Yellow Leaves</option>

                <option>Brown Spots</option>

                <option>Wilting Leaves</option>

                <option>Dry Leaves</option>

                <option>Slow Growth</option>

                <option>Falling Leaves</option>

            </select>

            <label>Describe your plant's symptoms</label>

            <textarea
                id="symptoms"
                placeholder="Describe what is happening to your plant...">
            </textarea>

            <button type="submit">Check Plant Health</button>

        </form>

        <div id="result"></div>

    </div>

    
    <script>
    document.getElementById("doctorForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const plant = document.getElementById("plantName").value.trim();
        const problem = document.getElementById("problem").value;
        const symptoms = document.getElementById("symptoms").value.trim();
        const result = document.getElementById("result");
        const button = this.querySelector('button[type="submit"]');

        if (!plant) {
            alert("Please enter a plant name.");
            return;
        }

        if (!problem) {
            alert("Please select a plant problem.");
            return;
        }

        button.disabled = true;
        button.textContent = "Analyzing...";
        result.style.display = "block";
        result.textContent = "🌿 Gemini AI is examining your plant symptoms. Please wait...";

        try {

            const response = await fetch(
                "http://127.0.0.1:5001/api/doctor",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        plant_name: plant,
                        problem: problem,
                        symptoms: symptoms
                    })
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Unable to analyze plant.");
            }

            const heading = document.createElement("h2");
            heading.textContent = "🌿 AI Plant Health Report";

            const plantInfo = document.createElement("p");
            plantInfo.textContent = "Plant: " + data.plant_name;

            const problemInfo = document.createElement("p");
            problemInfo.textContent = "Observed Problem: " + data.problem;

            const generated = document.createElement("p");
            generated.textContent = "Generated by Gemini AI";
            generated.style.color = "#16834e";
            generated.style.fontWeight = "bold";

            const report = document.createElement("div");

            report.style.lineHeight = "1.8";
            report.style.marginTop = "15px";

            function formatAIReport(text) {
                const lines = text.split("\n");

                return lines.map(line => {
                    line = line.trim();

                    if (line.startsWith("### ")) {
                        return `<h3>${line.substring(4)}</h3>`;
                    }

                    if (line.startsWith("## ")) {
                        return `<h2>${line.substring(3)}</h2>`;
                    }

                    if (line.startsWith("# ")) {
                        return `<h2>${line.substring(2)}</h2>`;
                    }

                    if (line.startsWith("* ") || line.startsWith("- ")) {
                        return `<p>• ${line.substring(2).replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")}</p>`;
                    }

                    line = line.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");

                    return line ? `<p>${line}</p>` : "";
                }).join("");
            }

            report.innerHTML = formatAIReport(data.health_report);

            result.replaceChildren(
                heading,
                plantInfo,
                problemInfo,
                generated,
                report
            );

        } catch (error) {

            console.error("AI Doctor Error:", error);
            result.textContent = "Sorry! " + error.message;

        } finally {

            button.disabled = false;
            button.textContent = "Check Plant Health";
        }
    });
    </script>

</body>
</html>
